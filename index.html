<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E CREW - Type Rating Exam System</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1-Ix2jV27kfEwv3lycXA_4FGqpKS6TqtD">
    <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1-Ix2jV27kfEwv3lycXA_4FGqpKS6TqtD">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .page-fade { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-checkbox:checked + label { background-color: #eff6ff; border-color: #3b82f6; color: #1d4ed8; }
        
        .text-gold { color: #FFD700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.4); }
        .bg-dark-card { background-color: #131926; }
        .modal-body-scroll { max-height: 70vh; overflow-y: auto; padding-right: 4px; }

        /* --- CSS FOR PDF PRINTING --- */
        #print-area { display: none; }
        @media print {
            @page { size: A4; margin: 20mm; }
            html, body { 
                width: auto !important; 
                max-width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                background: white !important; 
            }
            body > *:not(#print-area) { display: none !important; }
            #print-area {
                display: block !important;
                width: auto !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white;
                color: black;
                position: static;
            }
            .print-page { 
                font-family: 'Calibri', sans-serif; 
                font-size: 11pt;
                line-height: 1.5;
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
            }
            .print-page * { box-sizing: border-box; }
            .print-header { text-align: center; border-bottom: 2px solid black; padding-bottom: 10px; margin-bottom: 20px; }
            .print-header h1 { font-size: 18pt; margin: 0; font-weight: bold; }
            .print-header h2 { font-size: 14pt; margin: 5px 0 0 0; font-weight: bold; text-transform: uppercase; }
            .print-header h3 { font-size: 11pt; margin: 5px 0 0 0; font-weight: normal; }
            .print-section-title { font-weight: bold; font-size: 11pt; border-bottom: 1px solid black; margin-top: 20px; margin-bottom: 10px; padding-bottom: 3px; text-transform: uppercase; }
            .print-table { width: 100%; font-size: 11pt; border-collapse: collapse; }
            .print-table td { padding: 4px 0; vertical-align: top; overflow-wrap: break-word; word-break: normal; }
            .print-table td:first-child { width: 160px; font-weight: normal; }
            .print-result-box { margin: 15px 0; font-size: 11pt; text-align: center; }
            .print-score { font-size: 24pt; font-weight: bold; }
            .print-summary-item { margin-bottom: 15px; page-break-inside: avoid; }
            .print-summary-item.correct { color: green !important; }
            .print-summary-item.wrong { color: red !important; }
            
            .print-signatures { margin-top: 50px; width: 100%; display: flex; justify-content: space-between; text-align: center; page-break-inside: avoid; }
            .print-sig-box { width: 250px; display: flex; flex-direction: column; align-items: center; }
            .print-sig-title { font-size: 11pt; margin-bottom: 5px; }
            .print-sig-img { height: 80px; width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 5px; }
            .print-sig-img img { max-height: 100%; max-width: 100%; object-fit: contain; }
            .print-sig-name { font-weight: bold; font-size: 11pt; text-transform: uppercase; text-decoration: underline; margin-bottom: 2px; }
            .print-sig-detail { font-size: 10pt; }
        }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzcfPBaHdmTRLCSrvuT1F-qDsJWUZZQT8",
            authDomain: "twa-ecrew.firebaseapp.com",
            projectId: "twa-ecrew",
            storageBucket: "twa-ecrew.firebasestorage.app",
            messagingSenderId: "559962441630",
            appId: "1:559962441630:web:47087fd2ec7f08156c788f",
            measurementId: "G-MPTFR90EGW"
        };
        
        window.appId = 'e-crew-twa';
        window.app = initializeApp(firebaseConfig);
        window.db = getFirestore(window.app);
        window.auth = getAuth(window.app);
        window.fsDoc = doc; window.fsSetDoc = setDoc; window.fsOnSnapshot = onSnapshot;

        async function initFirebase() {
            try {
                await signInAnonymously(window.auth);
                window.firebaseReady = true;
                if(window.loadDataFromCloud) window.loadDataFromCloud(); 
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app').classList.remove('opacity-0');
                alert("Gagal koneksi ke server. Pastikan Anda memiliki internet dan Anonymous Auth aktif di Firebase.");
            }
        }
        initFirebase();
    </script>
</head>

        <div class="text-blue-600 font-black tracking-widest uppercase text-sm">Connecting Database...</div>
    </div>

    <div id="print-area"></div>

    <div id="app" class="opacity-0 transition-opacity duration-500">
        <!-- Auth Section -->
        <div id="auth-section" class="min-h-screen flex items-center justify-center p-4 gradient-bg relative">
            <div class="max-w-md w-full glass-morphism p-8 rounded-3xl shadow-2xl page-fade">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto mb-4 flex items-center justify-center">
                        <img src="https://lh3.googleusercontent.com/d/1-Ix2jV27kfEwv3lycXA_4FGqpKS6TqtD" alt="Logo" class="w-full h-full object-contain drop-shadow-lg" />
                    </div>

                    <h2 class="text-md font-medium text-blue-600">Type Rating Exam System</h2>
                    <p class="text-[10px] uppercase tracking-widest text-slate-400 mt-1 font-bold">Transwisata Prima Aviation</p>
                </div>

                <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                    <button id="tab-login" onclick="switchAuth('login')" class="flex-1 py-3 text-xs font-black rounded-lg bg-white text-blue-600 shadow-sm transition-all uppercase tracking-widest">Login</button>
                    <button id="tab-register" onclick="switchAuth('register')" class="flex-1 py-3 text-xs font-black rounded-lg text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest">Register</button>

                <form id="form-login" class="space-y-4" onsubmit="handleLogin(event)">

                    <input type="password" id="login-pass" placeholder="Password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:bg-white transition-all text-sm font-medium">
                    <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black uppercase tracking-widest shadow-lg shadow-blue-200 transition-all mt-2 text-sm">Sign In</button>
                </form>

                <form id="form-register" class="space-y-4 hidden" onsubmit="handleRegister(event)">
                    <input type="text" id="reg-name" placeholder="Full Name" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    <input type="text" id="reg-id" placeholder="Username (for login)" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                    <input type="password" id="reg-pass" placeholder="Password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">

                        </select>
                        <select id="reg-rating" class="w-full px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                            <option>Gulfstream IV-SP (G-IV)</option><option>Beechcraft King Air 350 (BE-300)</option><option>Casa 212 (CA-212)</option><option>Agusta 109S Grand (AW-109)</option><option>Bell 412 EP (B412)</option>
                        </select>
                    </div>
                    <input type="text" id="reg-license" placeholder="License (e.g. ATPL/ 20-0007)" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none">

        <!-- Main Section -->

                        <button onclick="renderTabContent('assign')" id="nt-assign" class="px-6 py-4 text-xs font-black uppercase tracking-widest border-b-2 transition-colors border-transparent text-slate-400 hover:text-slate-600">Assign Tasks</button>

    <!-- Modals -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-[100] p-4 opacity-100 transition-opacity">

    <!-- Main Logic -->
    <script>
        // Global Anti-Stuck Failsafe (12 seconds)
        setTimeout(() => {
            const loader = document.getElementById('loading-screen');
            if(!loader.classList.contains('hidden')) {
                loader.classList.add('hidden');
                document.getElementById('app').classList.remove('opacity-0');
                console.warn("Failsafe: Loading screen removed due to timeout.");
            }
        }, 12000);

        let state = {
            users: [], instructors: [], assignments: [], questionSets: [],
            formNo: { value: 'F/TWA-OPS/061/01', date: '21 Jun 2024' },
            admin: { u: 'admin', p: 'admin119-021' }, superAdmin: { code: '2805' },
            currentUser: null, isAdmin: false, activeTab: 'users',
            lookups: {
                ranks: ['CCP', 'FI', 'GI', 'Capt', 'FO'],
                ratings: ['Gulfstream IV-SP (G-IV)', 'Beechcraft King Air 350 (BE-300)', 'Casa 212 (CA-212)', 'Agusta 109S Grand (AW-109)', 'Bell 412 EP (B412)'],
                categories: ['Type Rating', 'Mandatory Training']
            }
        };

        let unsubscribeSnapshot = null;

        function showLoading() { document.getElementById('loading-screen').classList.remove('hidden'); document.getElementById('app').classList.add('opacity-0'); }
        function hideLoading() { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('app').classList.remove('opacity-0'); }

        // --- FIREBASE SYNC ---
        window.loadDataFromCloud = function() {
            if (!window.firebaseReady || !window.auth.currentUser) return;
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            
            showLoading();
            const docRef = window.fsDoc(window.db, 'artifacts', window.appId, 'public', 'data', 'ecrew_db', 'main_state');
            
            const to = setTimeout(() => { hideLoading(); console.warn("Firebase listener timeout"); }, 8000);

            unsubscribeSnapshot = window.fsOnSnapshot(docRef, (docSnap) => {
                clearTimeout(to);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.users = data.users || []; state.instructors = data.instructors || [];
                    state.assignments = data.assignments || []; state.questionSets = data.questionSets || [];
                    if (data.formNo !== undefined) state.formNo = data.formNo;
                    if (data.admin && data.admin.u !== undefined) state.admin = data.admin;
                    if (data.superAdmin && data.superAdmin.code) state.superAdmin.code = data.superAdmin.code;
                } else { syncToCloud(); }
                
                hideLoading();
                if (state.currentUser) {
                    if (state.currentUser.role === 'superadmin') renderSuperAdmin();
                    else if (state.isAdmin) renderTabContent(state.activeTab);
                    else renderUserPortal();
                }
            }, (error) => {
                clearTimeout(to); hideLoading();
                console.error("Firestore Listen Error:", error);
            });
        };

        function syncToCloud() {
            if (!window.firebaseReady || !window.auth.currentUser) return;
            const docRef = window.fsDoc(window.db, 'artifacts', window.appId, 'public', 'data', 'ecrew_db', 'main_state');
            window.fsSetDoc(docRef, {
                users: state.users, instructors: state.instructors, assignments: state.assignments,
                questionSets: state.questionSets, formNo: state.formNo, admin: state.admin, superAdmin: state.superAdmin
            }).catch(err => console.error("Sync Failed:", err));
        }

        // --- AUTH ---
        function switchAuth(type) {
            document.getElementById('form-login').classList.toggle('hidden', type !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', type !== 'register');
            document.getElementById('tab-login').className = type === 'login' ? "flex-1 py-3 text-xs font-black rounded-lg bg-white text-blue-600 shadow-sm uppercase tracking-widest" : "flex-1 py-3 text-xs font-black rounded-lg text-slate-500 hover:text-slate-700 uppercase tracking-widest";
            document.getElementById('tab-register').className = type === 'register' ? "flex-1 py-3 text-xs font-black rounded-lg bg-white text-blue-600 shadow-sm uppercase tracking-widest" : "flex-1 py-3 text-xs font-black rounded-lg text-slate-500 hover:text-slate-700 uppercase tracking-widest";
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value, pass = document.getElementById('login-pass').value;

            if (id === 'superadmin' && pass === state.superAdmin.code) { state.currentUser = { name: 'Super Administrator', role: 'superadmin' }; state.isAdmin = true; loginSuccess(); return; }
            if (id === state.admin.u && pass === state.admin.p) { state.currentUser = { name: 'Administrator', role: 'admin' }; state.isAdmin = true; loginSuccess(); return; }
            
            const inst = state.instructors.find(x => x.username === id && x.password === pass);
            if (inst) { state.currentUser = { ...inst, role: 'instructor' }; state.isAdmin = true; loginSuccess(); return; }

            const u = state.users.find(x => x.username === id && x.password === pass);
            if (u) { state.currentUser = u; state.isAdmin = false; loginSuccess(); return; }
            alert('Username atau Password salah!');
        }

        function handleRegister(e) {
            e.preventDefault();
            const user = document.getElementById('reg-id').value;
            if (state.users.some(x => x.username === user) || state.instructors.some(x => x.username === user) || user === state.admin.u || user === 'superadmin') return alert('Username sudah digunakan!');
            const newUser = { id: Date.now(), name: document.getElementById('reg-name').value, username: user, password: document.getElementById('reg-pass').value, rank: document.getElementById('reg-rank').value, rating: document.getElementById('reg-rating').value, license: document.getElementById('reg-license').value, signUrl: '' };
            state.users.push(newUser); syncToCloud();
            alert('Registrasi berhasil! Silakan login.'); switchAuth('login'); e.target.reset();
        }

        function loginSuccess() {
            document.getElementById('auth-section').classList.add('hidden'); document.getElementById('main-section').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = state.currentUser.name;
            document.getElementById('user-display-role').innerText = state.currentUser.role === 'instructor' ? 'Instructor' : (state.currentUser.role || state.currentUser.rank);
            
            if (state.currentUser.role === 'superadmin') renderSuperAdmin();
            else if (state.isAdmin) { 
                document.getElementById('admin-tabs').classList.remove('hidden');
                if(state.currentUser.role === 'instructor') {
                    document.getElementById('nt-users').classList.add('hidden'); document.getElementById('nt-instructor').classList.add('hidden'); renderTabContent('questions');
                } else {
                    document.getElementById('nt-users').classList.remove('hidden'); document.getElementById('nt-instructor').classList.remove('hidden'); renderTabContent('users'); 
                }
            } else renderUserPortal();
        }

        function logout() {
            if(!confirm('Logout sekarang?')) return;
            if (window.activeExam && window.activeExam.timerId) clearInterval(window.activeExam.timerId);
            state.currentUser = null; state.isAdmin = false;
            document.getElementById('auth-section').classList.remove('hidden'); document.getElementById('main-section').classList.add('hidden');
            document.getElementById('admin-tabs').classList.add('hidden'); document.getElementById('form-login').reset();
        }

        // --- SUPER ADMIN ---
        function renderSuperAdmin() {
            document.getElementById('dynamic-content').innerHTML = `
                <div class="max-w-md mx-auto page-fade">
                    <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter mb-8 text-center">System Config</h2>
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Form Details</p>
                            <input type="text" id="sa-form-no" value="${state.formNo ? state.formNo.value : ''}" class="w-full p-3 border rounded-xl text-sm mb-3 font-mono">
                        </div>
                        <div class="pt-4 border-t border-slate-50">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Admin Credentials</p>
                            <input type="text" id="sa-admin-u" value="${state.admin.u}" class="w-full p-3 border rounded-xl text-sm mb-3">
                            <input type="text" id="sa-admin-p" value="${state.admin.p}" class="w-full p-3 border rounded-xl text-sm font-mono">
                        </div>
                        <div class="pt-4 border-t border-slate-50">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Super Admin PIN</p>
                            <input type="text" id="sa-pin" value="${state.superAdmin.code}" class="w-full p-3 border rounded-xl text-sm font-mono">
                        </div>
                        <button onclick="saveSuperAdmin()" class="w-full py-4 bg-slate-900 text-white rounded-xl text-xs font-black uppercase tracking-widest mt-4 hover:bg-slate-800">Save Configuration</button>
                    </div>
                    <div class="mt-8 text-center">
                        <button onclick="openImportHistoryModal()" class="px-6 py-3 bg-indigo-50 text-indigo-600 border border-indigo-200 hover:bg-indigo-100 rounded-xl text-xs font-black uppercase tracking-widest shadow-sm w-full">+ Import History (Sheets)</button>
                        <p class="text-[10px] text-slate-400 mt-2">Migrate old exam records</p>
                    </div>
                </div>
            `;
        }

        function saveSuperAdmin() {
            state.formNo.value = document.getElementById('sa-form-no').value; state.admin.u = document.getElementById('sa-admin-u').value;
            state.admin.p = document.getElementById('sa-admin-p').value; state.superAdmin.code = document.getElementById('sa-pin').value;
            syncToCloud(); alert('Konfigurasi disimpan.');
        }
        
        function promptVerify(cb) {

        function formatDisplayDate(dStr) {
            if(!dStr) return '-'; const parts = dStr.split('-'); if(parts.length !== 3) return dStr;
            return new Date(parts[0], parts[1]-1, parts[2]).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
        }

        // --- RECORD OF REVISION HELPER ---
        function logRevision(set, action, detail) {
            if (!set.revisions) set.revisions = [];
            const now = new Date(); const timeStr = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');
            let userStr = 'System';
            if (state.currentUser) {
                if(state.currentUser.role === 'superadmin') userStr = 'Super Admin';
                else if(state.currentUser.role === 'admin') userStr = 'Admin';
                else if(state.currentUser.role === 'instructor') userStr = 'Inst: ' + state.currentUser.name;
                else userStr = state.currentUser.name;
            }
            set.revisions.unshift({ time: timeStr, user: userStr, action: action, detail: detail });
            if (set.revisions.length > 50) set.revisions.pop();
        }

        function viewRevisionHistory(setId) {
            const set = state.questionSets.find(s => s.id === setId);
            document.getElementById('modal-title').innerText = "Revision Log: " + set.title;
            let html = `<div class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar">`;
            if (!set.revisions || set.revisions.length === 0) { html += `<div class="p-6 text-center text-slate-400 font-bold text-sm bg-slate-50 rounded-2xl border border-dashed border-slate-200">Belum ada riwayat perubahan.</div>`; }

            }
            document.getElementById('modal-body').innerHTML = html + `</div>`;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="px-6 py-2.5 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-xl text-xs font-black uppercase tracking-widest transition-colors w-full">Close</button>`;

        function processBulkImport(setId) {
            const text = document.getElementById('bulk-text').value;
            const defaultSection = document.getElementById('bulk-section').value || 'General';
            const set = state.questionSets.find(s => s.id === setId);
            if(!text.trim()) return alert('Teks kosong.');

            let currentQ = null, addedCount = 0;
            const lines = text.split('\n');
            let activeSectionName = defaultSection;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                let upperLine = line.toUpperCase();

                if (upperLine.startsWith('SECTION') || upperLine.startsWith('BAGIAN')) { activeSectionName = line; continue; }

                if (/^(Q?\d+[\.\)]\s*)/i.test(line)) {
                    if (currentQ) { set.questions.push(currentQ); addedCount++; }
                    currentQ = { id: 0, section: activeSectionName, text: line.replace(/^(Q?\d+[\.\)]\s*)/i, ''), options: {A:'', B:'', C:'', D:''}, answer: 'A' };
                } else if (upperLine.startsWith('A.') || upperLine.startsWith('A)')) { if (currentQ) currentQ.options.A = line.substring(2).trim();
                } else if (upperLine.startsWith('B.') || upperLine.startsWith('B)')) { if (currentQ) currentQ.options.B = line.substring(2).trim();
                } else if (upperLine.startsWith('C.') || upperLine.startsWith('C)')) { if (currentQ) currentQ.options.C = line.substring(2).trim();
                } else if (upperLine.startsWith('D.') || upperLine.startsWith('D)')) { if (currentQ) currentQ.options.D = line.substring(2).trim();
                } else if (upperLine.includes('ANSWER') || upperLine.includes('JAWABAN') || upperLine.startsWith('ANS:')) {
                    if (currentQ) {
                        let match = upperLine.match(/:\s*([A-D])/);
                        if (match && match[1]) currentQ.answer = match[1];
                    }
                } else {
                    if (currentQ && !currentQ.options.A) currentQ.text += ' ' + line;
                }
            }
            if (currentQ) { set.questions.push(currentQ); addedCount++; }
            set.questions.forEach((q, idx) => q.id = idx + 1);
            if (addedCount > 0) logRevision(set, 'AUTO PARSE (BULK IMPORT)', `Imported ${addedCount} questions.`);
            
            syncToCloud(); closeModal(); viewSetDetails(setId);
            alert(`Berhasil menambahkan ${addedCount} soal baru.`);
        }

            }

            document.getElementById('modal-title').innerText = "Exam Result Details";
            document.getElementById('modal-body').innerHTML = `<div class="space-y-6"><div class="bg-white p-6 rounded-2xl border border-slate-200"><h4 class="font-black text-slate-800 uppercase tracking-widest text-xs mb-4 border-b pb-2">${term} INFO</h4><div class="grid grid-cols-2 gap-4 text-sm"><div><span class="text-slate-400 text-[10px] uppercase block">Name</span> <span class="font-bold text-slate-800">${u.name}</span></div><div><span class="text-slate-400 text-[10px] uppercase block">Rank</span> <span class="font-bold text-slate-800">${u.rank}</span></div><div><span class="text-slate-400 text-[10px] uppercase block">License</span> <span class="font-bold text-slate-800">${u.license}</span></div><div><span class="text-slate-400 text-[10px] uppercase block">Instructor</span> <span class="font-bold text-slate-800">${instName}</span></div><div><span class="text-slate-400 text-[10px] uppercase block">Exam Date</span> <span class="font-bold text-slate-800">${formatDisplayDate(a.examDate)}</span></div><div><span class="text-slate-400 text-[10px] uppercase block">Duration</span> <span class="font-bold text-slate-800">${a.duration || '-'}</span></div></div></div><div class="bg-white p-6 rounded-2xl border border-slate-200 text-center shadow-inner"><div class="text-5xl font-black ${a.score < 75 ? 'text-red-500' : 'text-green-500'} mb-2">${a.score}%</div><div class="font-bold text-slate-800 text-sm uppercase">${a.grade} - ${correct}/${total} correct</div>${tL.includes('recurrent') ? `<div class="font-black text-xs mt-4 text-green-600 bg-green-50 inline-block px-3 py-1 rounded">CORRECTED TO 100%</div>` : ''}</div><div class="bg-white p-6 rounded-2xl border border-slate-200">${ansH}</div></div>`;
            document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="px-6 py-2.5 text-xs font-bold text-slate-400 uppercase">Close</button><button onclick="printExamResult(${assignmentId})" class="px-8 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-black uppercase">Print PDF</button>`;
            document.getElementById('modal-container').classList.remove('hidden');
        }

        function printExamResult(assignmentId) {
            const a = state.assignments.find(x => x.id === assignmentId), u = state.users.find(x => x.id === a.userId);
            if(!a || !u) return;

            const tL = a.examTitle.toLowerCase(), term = (tL.includes('initial') || tL.includes('upgrade')) ? 'Trainee' : 'Candidate';
            const iP = a.instructor.split('('), instName = iP[0].trim(), instLOA = iP[2] ? iP[2].replace(')','').trim() : (iP[1] ? iP[1].replace(')','').trim() : '-');
            const instObj = state.instructors.find(x => x.name === instName), instSignUrl = instObj ? instObj.signUrl : '';
            const set = state.questionSets.find(q => q.title === a.examTitle), qs = set && set.questions.length > 0 ? set.questions : Array(10).fill({id: 0, text: '...', options: {A: 'A', B: 'B', C: 'C', D: 'D'}, answer: 'C'});
            
            const total = qs.length, correct = Math.round((a.score / 100) * total);
            let ansH = '';
            for(let i=0; i<total; i++) {
                const q = qs[i], ua = a.answers ? a.answers[q.id] : null;
                if(ua === q.answer) { ansH += `<div class="print-summary-item correct"><b>Q${i+1}: ${q.text}</b><br>${q.answer}. ${q.options[q.answer]} ✓</div>`; } 
                else { ansH += `<div class="print-summary-item wrong"><b>Q${i+1}: ${q.text}</b><br>${ua ? ua+'. '+q.options[ua] : 'No Answer'} ✗ (Correct: ${q.answer}. ${q.options[q.answer]})</div>`; }
            }

            const cyc = (tL.includes('recurrent') && set && set.cycle && set.cycle !== 'None') ? set.cycle : null;

            document.getElementById('print-area').innerHTML = `
                <div class="print-page">
                    <div class="print-header">
                        <img src="https://lh3.googleusercontent.com/d/1WNcGjsZ9_Fp54xzOl01EYRqM6-wY5Zh7" alt="TWA Logo" style="display: block; margin: 0 auto 15px auto; height: 70px; object-fit: contain;" />
                        <h1>Transwisata Prima Aviation</h1><h2>FLIGHT CREW EXAMINATION RESULT</h2><h3>${a.examTitle}</h3>${cyc ? `<h4 style="margin: 5px 0 0 0; font-size: 12pt;">(${cyc.toUpperCase()})</h4>` : ''}
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; font-size: 10pt; margin-top: 15px;"><div style="text-align: left; font-weight: bold; font-style: italic;">Online Examination Form</div><div style="text-align: right;">Form No: ${state.formNo ? state.formNo.value : '-'}</div></div>
                    </div>
                    <div class="print-section-title">${term.toUpperCase()} INFORMATION</div>
                    <table class="print-table"><tr><td>Name ${term}:</td><td><b>${u.name}</b></td></tr><tr><td>Rank:</td><td><b>${u.rank}</b></td></tr><tr><td>No. License:</td><td><b>${u.license}</b></td></tr>${cyc ? `<tr><td>Training Cycle:</td><td><b>${cyc}</b></td></tr>` : ''}<tr><td>Name Instructor:</td><td><b>${instName}</b></td></tr><tr><td>LOA Instructor:</td><td><b>${instLOA}</b></td></tr><tr><td>Exam Date:</td><td><b>${formatDisplayDate(a.examDate)}</b></td></tr><tr><td>Exam Time:</td><td><b>${a.examTime || '-'}</b></td></tr><tr><td>Duration:</td><td><b>${a.duration || '-'}</b></td></tr></table>
                    <div class="print-section-title" style="text-align: center;">EXAMINATION RESULT</div>
                    <div class="print-result-box"><div class="print-score" style="color: ${a.score < 75 ? 'red' : 'green'};">${a.score}%</div><div style="font-weight: bold; margin-bottom: 5px;">${a.grade} - ${correct} out of ${total} correct</div><div>Passing Score: 75% | Result: ${a.score >= 75 ? '✓ PASS' : '✗ FAIL'}</div>${tL.includes('recurrent') ? `<div style="font-weight: bold; margin-top: 10px; color: green;">CORRECTED TO 100%</div>` : ''}</div>
                    <div class="print-section-title">ANSWER SUMMARY</div><div>${ansH}</div>
                    <div class="print-signatures"><div class="print-sig-box"><div class="print-sig-title">${term} Signature</div><div class="print-sig-img">${u.signUrl || ''}</div><div class="print-sig-name">${u.name}</div><div class="print-sig-detail">${u.license || '-'}</div></div><div class="print-sig-box"><div class="print-sig-title">Examiner Signature</div><div class="print-sig-img">${instSignUrl || ''}</div><div class="print-sig-name">${instName}</div><div class="print-sig-detail">${instLOA || '-'}</div></div></div>
                </div>`;
            window.print(); setTimeout(() => { document.getElementById('print-area').innerHTML = ''; }, 1000);
        }

        function openImportHistoryModal() {
            promptVerify(() => {
                document.getElementById('modal-title').innerText = "Import Exam History (Sheets)";
                document.getElementById('modal-body').innerHTML = `<div class="space-y-4"><div class="p-4 bg-amber-50 border border-amber-100 rounded-xl text-xs text-amber-800"><p class="font-bold mb-2 uppercase tracking-widest text-[10px]">Instruksi Import:</p><ol class="list-decimal ml-4 space-y-1"><li>Buka Sheets Anda (Tab Assignments).</li><li>Copy data dari Baris ke-2 ke bawah.</li><li>Paste ke dalam kotak teks di bawah ini.</li></ol></div><div><textarea id="import-history-text" rows="10" class="w-full p-3 border rounded-xl text-xs font-mono whitespace-pre-wrap outline-none" placeholder="Paste..."></textarea></div></div>`;
                document.getElementById('modal-footer').innerHTML = `<button onclick="closeModal()" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-slate-600">Cancel</button><button onclick="processHistoryImport()" class="px-8 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-black uppercase">Process Import</button>`;
                document.getElementById('modal-container').classList.remove('hidden');
            });
        }

        function processHistoryImport() {
            const raw = document.getElementById('import-history-text').value; if (!raw.trim()) return alert("Teks kosong.");
            const rows = raw.trim().split('\n'); let ic = 0, ec = 0;
            rows.forEach(r => {
                const c = r.split('\t');
                if (c.length >= 12) {
                    try {
                        const id = Number(c[0].trim());
                        if (!state.assignments.find(a => a.id === id)) {
                            let pa = null; if (c[12]) { try { pa = JSON.parse(c[12].trim().replace(/^"|"$/g, '').replace(/""/g, '"')); } catch (e) {} }
                            state.assignments.push({ id: id, userId: Number(c[1].trim()), userName: c[2].trim(), examTitle: c[3].trim(), instructor: c[4].trim(), assignedDate: c[5].trim(), examDate: c[6].trim(), examTime: c[7].trim(), duration: c[8].trim(), status: c[9].trim(), score: c[10].trim() !== '' ? Number(c[10].trim()) : null, grade: c[11].trim(), answers: pa }); ic++;
                        }
                    } catch (e) { ec++; }
                }
            });
            if (ic > 0) { syncToCloud(); alert(`Diimpor: ${ic} riwayat. (${ec} gagal/diabaikan).`); closeModal(); if (state.currentUser && state.currentUser.role === 'superadmin') renderSuperAdmin(); else renderHistoryData(); } else { alert("Tidak ada data baru."); }
        }

        // --- USER PORTAL ---
        function renderUserPortal() {
            let html = `<div class="mb-8 page-fade"><h2 class="text-3xl font-black text-slate-800 tracking-tight">Welcome, ${state.currentUser.name}</h2></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 page-fade">`;
            const myTasks = state.assignments.filter(a => a.userId === state.currentUser.id);
            if (myTasks.length === 0) { html += `<div class="col-span-full p-12 bg-white rounded-3xl text-center"><p class="text-slate-400 font-bold">No tasks assigned.</p></div>`; } 
            else {
                myTasks.forEach(a => {
                    const isDone = a.status === 'COMPLETED', inProg = a.status === 'IN PROGRESS';
                    html += `<div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col relative group"><div class="flex justify-between items-start mb-4"><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${isDone?'bg-green-100 text-green-700':inProg?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700'}">${a.status}</span></div><h4 class="text-lg font-black text-slate-900 leading-tight mb-2">${a.examTitle}</h4><div class="space-y-1 text-xs text-slate-500 mb-6 flex-1"><p>📅 ${formatDisplayDate(a.examDate)}</p><p>⏰ ${a.examTime || '-'} | ⏳ ${a.duration || '-'}</p></div><div>${isDone ? `<div class="p-3 bg-slate-50 rounded-xl text-center"><p class="text-[10px] font-black text-slate-400 uppercase mb-1">Final Score</p><p class="text-2xl font-black ${a.score >= 75 ? 'text-green-500' : 'text-red-500'}">${a.score}%</p></div>` : `<button onclick="startRealExam(${a.id})" class="w-full py-4 ${inProg ? 'bg-amber-500' : 'bg-blue-600'} text-white rounded-xl text-xs font-black uppercase shadow-lg">${inProg ? 'Resume Exam' : 'Start Exam'}</button>`}</div></div>`;
                });
            }
            document.getElementById('dynamic-content').innerHTML = html + `</div>`;
        }

        function startRealExam(assignmentId) {
            const a = state.assignments.find(x => x.id === assignmentId), set = state.questionSets.find(q => q.title === a.examTitle);
            if (!set || !set.questions || set.questions.length === 0) return alert('Exam questions not found.');
            const now = new Date(), eDateParts = a.examDate.split('-'); let durMins = 60;
            if (a.duration) { const hm = a.duration.match(/(\d+)h/), mm = a.duration.match(/(\d+)m/); durMins = ((hm ? parseInt(hm[1]) : 0) * 60) + (mm ? parseInt(mm[1]) : 0) || 60; }
            let initialTimeLeft = durMins * 60;

            if (eDateParts.length === 3) {
                const eDate = new Date(eDateParts[0], eDateParts[1] - 1, eDateParts[2]); eDate.setHours(0,0,0,0); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                if (today < eDate) return alert("Belum waktunya ujian.");
                if (today.getTime() === eDate.getTime() && a.examTime) {
                    const tParts = a.examTime.split(':');
                    if (tParts.length === 2) {
                        const currMins = now.getHours() * 60 + now.getMinutes(), examMins = parseInt(tParts[0]) * 60 + parseInt(tParts[1]);
                        if (currMins < examMins) return alert("Belum waktunya ujian.");
                        else if (currMins >= examMins + durMins) return alert("Waktu habis."); else initialTimeLeft = (examMins + durMins - currMins) * 60;
                    }
                }
            }

            let sq = [...set.questions]; for (let i = sq.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [sq[i], sq[j]] = [sq[j], sq[i]]; }
            window.activeExam = { assignment: a, set: set, questions: sq, currentIndex: 0, answers: {}, timeLeft: initialTimeLeft, timerId: null };
            a.status = 'IN PROGRESS'; syncToCloud(); 
            
            window.activeExam.timerId = setInterval(() => { window.activeExam.timeLeft--; if (window.activeExam.timeLeft <= 0) { clearInterval(window.activeExam.timerId); window.activeExam.timeLeft = 0; alert("Waktu habis!"); renderActiveExamUI(); } else updateTimerUI(); }, 1000);
            renderActiveExamUI();
        }

        function updateTimerUI() { const el = document.getElementById('exam-timer-display'); if (el && window.activeExam) { const m = Math.floor(window.activeExam.timeLeft / 60).toString().padStart(2, '0'), s = (window.activeExam.timeLeft % 60).toString().padStart(2, '0'); el.innerText = `${m}:${s}`; } }

        function renderActiveExamUI() {
            const ex = window.activeExam, q = ex.questions[ex.currentIndex], isLast = ex.currentIndex === ex.questions.length - 1, isFirst = ex.currentIndex === 0, timeUp = ex.timeLeft <= 0; 
            let html = `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden page-fade">
                    <div class="bg-blue-600 p-6 text-white flex justify-between items-center"><div><h3 class="font-black text-lg tracking-wider uppercase">${ex.set.title}</h3><p class="text-xs text-blue-200 mt-1 uppercase tracking-widest">Question ${ex.currentIndex + 1} of ${ex.questions.length}</p></div><div class="bg-blue-800/50 px-4 py-2 rounded-xl border border-blue-500 text-center"><span class="text-[10px] uppercase font-bold text-blue-200 block mb-1">Time Remaining</span><span id="exam-timer-display" class="font-mono font-bold text-2xl ${timeUp ? 'text-red-400' : ''}">--:--</span></div></div>
                    <div class="p-8 md:p-12"><span class="text-[10px] font-black bg-blue-50 text-blue-600 px-3 py-1 rounded uppercase tracking-widest">${q.section}</span><h4 class="text-xl font-bold text-slate-800 mt-6 mb-8 leading-relaxed">${ex.currentIndex + 1}. ${q.text}</h4>
                        <div class="space-y-4">${['A', 'B', 'C', 'D'].map(opt => { const optText = q.options[opt]; if (!optText) return ''; const isSel = ex.answers[q.id] === opt, cStyle = timeUp ? 'cursor-not-allowed opacity-70' : 'cursor-pointer hover:border-blue-300'; return `<div ${timeUp ? '' : `onclick="selectExamOption('${opt}')"`} class="p-5 border-2 rounded-2xl transition-all ${isSel ? 'border-blue-600 bg-blue-50 shadow-md' : `border-slate-100 bg-white ${cStyle}`}"><div class="flex items-center gap-4"><div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${isSel ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'}">${opt}</div><span class="font-medium text-slate-700 text-base">${optText}</span></div></div>`; }).join('')}</div>
                    </div>
                    <div class="bg-slate-50 p-6 border-t border-slate-100 flex justify-between items-center"><button onclick="navigateExam(-1)" class="px-8 py-3 text-sm font-bold text-slate-500 uppercase ${isFirst ? 'invisible' : ''}">Previous</button>${(isLast || timeUp) ? `<button onclick="submitExam(${timeUp ? 'true' : 'false'})" class="px-10 py-3 ${timeUp ? 'bg-red-600 animate-pulse' : 'bg-green-600'} text-white rounded-xl text-sm font-black uppercase">Submit</button>` : `<button onclick="navigateExam(1)" class="px-10 py-3 bg-blue-600 text-white rounded-xl text-sm font-black uppercase">Next</button>`}</div>
                </div>`;
            document.getElementById('dynamic-content').innerHTML = html; updateTimerUI(); 
        }

        function selectExamOption(opt) { if (window.activeExam.timeLeft <= 0) return; window.activeExam.answers[window.activeExam.questions[window.activeExam.currentIndex].id] = opt; renderActiveExamUI(); if (window.activeExam.currentIndex < window.activeExam.questions.length - 1) setTimeout(() => navigateExam(1), 300); }
        function navigateExam(dir) { window.activeExam.currentIndex += dir; renderActiveExamUI(); }
        function submitExam(force = false) {
            if (force !== true && !confirm("Kumpulkan jawaban sekarang?")) return;
            const ex = window.activeExam; clearInterval(ex.timerId); let cc = 0; ex.questions.forEach(q => { if (ex.answers[q.id] === q.answer) cc++; });
            const score = Math.round((cc / ex.questions.length) * 100); let grade = score === 100 ? 'PERFECT' : score >= 86 ? 'EXCELLENT' : score >= 75 ? 'PASSED' : 'FAILED';
            ex.assignment.status = 'COMPLETED'; ex.assignment.score = score; ex.assignment.grade = grade; ex.assignment.answers = ex.answers;
            syncToCloud(); renderExamResultUserView(ex, score, grade, cc);
        }

        function renderExamResultUserView(ex, score, grade, cc) {
            const isRec = ex.assignment.examTitle.toLowerCase().includes('recurrent'); let sCl = score === 100 ? "text-gold" : score >= 75 ? "text-green-500" : "text-red-500"; let ansH = '';
            ex.questions.forEach((q, idx) => {
                const ua = ex.answers[q.id];
                if(ua === q.answer) { ansH += `<div class="mb-3 p-5 bg-green-50 border border-green-100 rounded-xl"><p class="font-bold text-sm text-slate-800 mb-2">Q${idx + 1}: ${q.text}</p><p class="text-xs font-bold text-green-600">${q.answer}. ${q.options[q.answer]} ✓</p></div>`; } 
                else { ansH += `<div class="mb-3 p-5 bg-red-50 border border-red-100 rounded-xl"><p class="font-bold text-sm text-slate-800 mb-2">Q${idx + 1}: ${q.text}</p><p class="text-xs font-bold text-red-500 mb-2">${ua ? ua + '. ' + q.options[ua] : 'No Answer'} ✗</p><p class="text-[10px] font-bold text-green-600">Correct: ${q.answer}. ${q.options[q.answer]}</p></div>`; }
            });
            document.getElementById('dynamic-content').innerHTML = `<div class="max-w-3xl mx-auto space-y-6 page-fade"><div class="bg-dark-card p-8 rounded-3xl text-center border border-slate-700 relative overflow-hidden"><h2 class="text-white text-sm font-black uppercase mb-4 relative z-10">EXAMINATION COMPLETED</h2><div class="text-7xl font-black ${sCl} mb-4 relative z-10">${score}%</div><div class="inline-block px-4 py-1 rounded-full ${score >= 75 ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'} font-bold text-sm uppercase mb-2 relative z-10">${grade}</div><p class="text-slate-400 text-xs font-medium relative z-10">${cc} correct out of ${ex.questions.length}</p>${isRec ? `<p class="mt-4 text-green-400 font-bold text-xs uppercase relative z-10 border border-green-500/30 inline-block px-3 py-1 rounded bg-green-500/10">CORRECTED TO 100%</p>` : ''}</div><div class="bg-white rounded-3xl p-8"><h3 class="text-lg font-black text-slate-800 uppercase mb-6 border-b border-slate-100 pb-4">Detailed Review</h3><div class="space-y-2">${ansH}</div></div><div class="text-center pt-4"><button onclick="renderUserPortal()" class="px-10 py-4 bg-slate-900 text-white rounded-xl text-sm font-black uppercase">Back to Dashboard</button></div></div>`;
        }

        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
        function updateSignPreview(val, boxId) { document.getElementById(boxId).innerHTML = val || '<span class="text-[10px] text-slate-400 italic">No signature yet</span>'; }
    </script>
</body>
</html>
