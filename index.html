    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .gradient-bg { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }

        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .text-gold { color: #FFD700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.4); }

        /* --- CSS FOR PDF PRINTING --- */
        #print-area { display: none; }
        @media print {
            @page { size: A4; margin: 20mm; }
            html, body { 
                width: auto !important; 
                max-width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
                background: white !important; 
            }
            body > *:not(#print-area) { display: none !important; }
            #print-area {
                display: block !important;
                width: auto !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white;
                color: black;
                position: static;
            }
            .print-page { 
                font-family: 'Calibri', sans-serif; 
                font-size: 11pt;
                line-height: 1.5;
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
            }
            .print-page * { box-sizing: border-box; }
            .print-header { text-align: center; border-bottom: 2px solid black; padding-bottom: 10px; margin-bottom: 20px; }
            .print-header h1 { font-size: 18pt; margin: 0; font-weight: bold; }
            .print-header h2 { font-size: 14pt; margin: 5px 0 0 0; font-weight: bold; text-transform: uppercase; }
            .print-header h3 { font-size: 11pt; margin: 5px 0 0 0; font-weight: normal; }
            .print-section-title { font-weight: bold; font-size: 11pt; border-bottom: 1px solid black; margin-top: 20px; margin-bottom: 10px; padding-bottom: 3px; text-transform: uppercase; }
            .print-table { width: 100%; font-size: 11pt; border-collapse: collapse; }
            .print-table td { padding: 4px 0; vertical-align: top; overflow-wrap: break-word; word-break: normal; }
            .print-table td:first-child { width: 160px; font-weight: normal; }
            .print-result-box { margin: 15px 0; font-size: 11pt; text-align: center; }
            .print-score { font-size: 24pt; font-weight: bold; }
            .print-summary-item { margin-bottom: 15px; page-break-inside: avoid; }
            .print-summary-item.correct { color: green !important; }
            .print-summary-item.wrong { color: red !important; }
            
            .print-signatures { margin-top: 50px; width: 100%; display: flex; justify-content: space-between; text-align: center; page-break-inside: avoid; }
            .print-sig-box { width: 250px; display: flex; flex-direction: column; align-items: center; }
            .print-sig-title { font-size: 11pt; margin-bottom: 5px; }
            .print-sig-img { height: 80px; width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 5px; }
            .print-sig-img img { max-height: 100%; max-width: 100%; object-fit: contain; }
            .print-sig-name { font-weight: bold; font-size: 11pt; text-transform: uppercase; text-decoration: underline; margin-bottom: 2px; }
            .print-sig-detail { font-size: 10pt; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // TWA Firebase Configuration
        const firebaseConfig = {
          apiKey: "AIzaSyBzcfPBaHdmTRLCSrvuT1F-qDsJWUZZQT8",
          authDomain: "twa-ecrew.firebaseapp.com",
          projectId: "twa-ecrew",
          storageBucket: "twa-ecrew.firebasestorage.app",
          messagingSenderId: "559962441630",
          appId: "1:559962441630:web:47087fd2ec7f08156c788f",
          measurementId: "G-MPTFR90EGW"
        };
        
        // Environment fallback for immersive sandbox (if exists)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'e-crew-twa';
        
        window.app = initializeApp(firebaseConfig);
        window.db = getFirestore(window.app);
        window.auth = getAuth(window.app);
        window.appId = appId;

        async function initFirebase() {
            try {
                // PERBAIKAN: Mengabaikan token bawaan sandbox dan langsung menggunakan Anonymous Login
                // Pastikan "Anonymous" Sign-in Method sudah diaktifkan di Firebase Console Anda.
                await signInAnonymously(window.auth);
                
                console.log("Firebase Auth Success");
                window.firebaseReady = true;
                if(window.loadDataFromCloud) window.loadDataFromCloud(); 
            } catch (error) {
                console.error("Firebase Auth Error:", error);
                alert("Koneksi Database Gagal: Harap pastikan 'Anonymous' Sign-in Method sudah diaktifkan di Firebase Console > Authentication.");
            }
        }
        initFirebase();
        
        // Export Firestore functions to window for global access
        window.fsDoc = doc;
        window.fsSetDoc = setDoc;
        window.fsOnSnapshot = onSnapshot;
        window.fsGetDoc = getDoc;
    </script>
</head>

    <script>
        // State Management
        let state = {
            users: [],
            instructors: [],
            assignments: [],
            questionSets: [],
            formNo: { value: 'F/TWA-OPS/061/01', date: '21 Jun 2024' },
            admin: { u: 'admin', p: 'admin119-021' }, // PERBAIKAN: Default password diubah ke admin119-021
            superAdmin: { code: '2805' },
            currentUser: null,
            isAdmin: false,
            activeTab: 'users',
            lookups: {
                ranks: ['CCP', 'FI', 'GI', 'Capt', 'FO'],
                ratings: ['Gulfstream IV-SP (G-IV)', 'Beechcraft King Air 350 (BE-300)', 'Casa 212 (CA-212)', 'Agusta 109S Grand (AW-109)', 'Bell 412 EP (B412)'],
                categories: ['Type Rating', 'Mandatory Training']
            }
        };

        let unsubscribeSnapshot = null;

        function showLoading() { document.getElementById('loading-screen').classList.remove('hidden'); document.getElementById('app').classList.add('opacity-0'); }
        function hideLoading() { document.getElementById('loading-screen').classList.add('hidden'); document.getElementById('app').classList.remove('opacity-0'); }

        // --- FIREBASE INTEGRATION ---
        function loadDataFromCloud() {
            if (!window.firebaseReady || !window.auth.currentUser) return;
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            // Referensi ke dokumen tunggal yang menyimpan seluruh state di Firestore
            const docRef = window.fsDoc(window.db, 'artifacts', window.appId, 'public', 'data', 'ecrew_db', 'main_state');
            
            showLoading();
            
            unsubscribeSnapshot = window.fsOnSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    state.users = data.users || [];
                    state.instructors = data.instructors || [];
                    state.assignments = data.assignments || [];
                    state.questionSets = data.questionSets || [];
                    if (data.formNo !== undefined) state.formNo = data.formNo;
                    if (data.admin && data.admin.u !== undefined) state.admin = data.admin;
                    if (data.superAdmin && data.superAdmin.code) state.superAdmin.code = data.superAdmin.code;
                } else {
                    syncToCloud(); 
                }
                
                hideLoading();
                
                if (state.currentUser) {
                    if (state.currentUser.role === 'superadmin') renderSuperAdmin();
                    else if (state.isAdmin) renderTabContent(state.activeTab);
                    else renderUserPortal();
                }
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                hideLoading();
            });
        }

        function syncToCloud() {
            if (!window.firebaseReady || !window.auth.currentUser) return;
            
            const docRef = window.fsDoc(window.db, 'artifacts', window.appId, 'public', 'data', 'ecrew_db', 'main_state');
            
            const dataToSave = {
                users: state.users,
                instructors: state.instructors,
                assignments: state.assignments,
                questionSets: state.questionSets,
                formNo: state.formNo,
                admin: state.admin,
                superAdmin: state.superAdmin
            };
            
            window.fsSetDoc(docRef, dataToSave).catch(err => {
                console.error("Failed to sync to Firestore:", err);
            });
        }

        // --- AUTH & ROUTING ---
        function switchAuth(type) {
            document.getElementById('form-login').classList.toggle('hidden', type !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', type !== 'register');
            document.getElementById('tab-login').className = type === 'login' ? "flex-1 py-3 text-xs font-black rounded-lg bg-white text-blue-600 shadow-sm transition-all uppercase tracking-widest" : "flex-1 py-3 text-xs font-black rounded-lg text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest";
            document.getElementById('tab-register').className = type === 'register' ? "flex-1 py-3 text-xs font-black rounded-lg bg-white text-blue-600 shadow-sm transition-all uppercase tracking-widest" : "flex-1 py-3 text-xs font-black rounded-lg text-slate-500 hover:text-slate-700 transition-all uppercase tracking-widest";
        }

        function handleLogin(e) {
            e.preventDefault();
            const id = document.getElementById('login-id').value;
            const pass = document.getElementById('login-pass').value;

            if (id === 'superadmin' && pass === state.superAdmin.code) {
                state.currentUser = { name: 'Super Administrator', role: 'superadmin' };
                state.isAdmin = true;
                loginSuccess(); return;
            }

            if (id === state.admin.u && pass === state.admin.p) {
                state.currentUser = { name: 'Administrator', role: 'admin' };
                state.isAdmin = true;
                loginSuccess(); return;
            }

            const u = state.users.find(x => x.username === id && x.password === pass);
            if (u) {
                state.currentUser = u;
                state.isAdmin = false;
                loginSuccess(); return;
            }

            alert('Invalid credentials!');
        }

        function handleRegister(e) {
            e.preventDefault();
            const n = document.getElementById('reg-name').value;
            const user = document.getElementById('reg-id').value;
            if (state.users.some(x => x.username === user) || user === state.admin.u || user === 'superadmin') {
                alert('Username already exists!'); return;
            }
            const newUser = {
                id: Date.now(),
                name: n, username: user,
                password: document.getElementById('reg-pass').value,
                rank: document.getElementById('reg-rank').value,
                rating: document.getElementById('reg-rating').value,
                license: document.getElementById('reg-license').value,
                signUrl: ''
            };
            state.users.push(newUser);
            syncToCloud();
            alert('Registration successful! Please login.');
            switchAuth('login');
            e.target.reset();
        }

        function loginSuccess() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = state.currentUser.name;
            document.getElementById('user-display-role').innerText = state.currentUser.role || state.currentUser.rank;
            
            if (state.currentUser.role === 'superadmin') {
                renderSuperAdmin();
            } else if (state.isAdmin) {
                document.getElementById('admin-tabs').classList.remove('hidden');
                renderTabContent('users');
            } else {
                renderUserPortal();
            }
        }

        function logout() {
            if(!confirm('Are you sure you want to logout?')) return;
            if (window.activeExam && window.activeExam.timerId) clearInterval(window.activeExam.timerId);
            state.currentUser = null; state.isAdmin = false;
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-section').classList.add('hidden');
            document.getElementById('admin-tabs').classList.add('hidden');
            document.getElementById('form-login').reset();
        }

        // --- SUPER ADMIN ---
        function renderSuperAdmin() {
            document.getElementById('dynamic-content').innerHTML = `
                <div class="max-w-md mx-auto page-fade">
                    <h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter mb-8 text-center">System Config</h2>
                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 space-y-6">
                        <div>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Form Details</p>
                            <input type="text" id="sa-form-no" value="${state.formNo ? state.formNo.value : ''}" class="w-full p-3 border rounded-xl text-sm mb-3 font-mono" placeholder="Form No (e.g. F/TWA...)">
                        </div>
                        <div class="pt-4 border-t border-slate-50">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Admin Credentials</p>
                            <input type="text" id="sa-admin-u" value="${state.admin.u}" class="w-full p-3 border rounded-xl text-sm mb-3" placeholder="Admin Username">
                            <input type="text" id="sa-admin-p" value="${state.admin.p}" class="w-full p-3 border rounded-xl text-sm font-mono" placeholder="Admin Password">
                        </div>
                        <div class="pt-4 border-t border-slate-50">
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Super Admin PIN</p>
                            <input type="text" id="sa-pin" value="${state.superAdmin.code}" class="w-full p-3 border rounded-xl text-sm font-mono" placeholder="PIN Code (Numbers Only)">
                        </div>
                        <button onclick="saveSuperAdmin()" class="w-full py-4 bg-slate-900 text-white rounded-xl text-xs font-black uppercase tracking-widest mt-4">Save Configuration</button>
                    </div>
                </div>
            `;
        }

        function saveSuperAdmin() {
            state.formNo.value = document.getElementById('sa-form-no').value;
            state.admin.u = document.getElementById('sa-admin-u').value;
            state.admin.p = document.getElementById('sa-admin-p').value;
            state.superAdmin.code = document.getElementById('sa-pin').value;
            syncToCloud(); alert('Configuration saved.');
        }
        
        function promptVerify(cb) {

        function processBulkImport(setId) {
            const text = document.getElementById('bulk-text').value;
            const sectionName = document.getElementById('bulk-section').value || 'General';
            const set = state.questionSets.find(s => s.id === setId);
            
            if(!text.trim()) return alert('Teks tidak boleh kosong.');

            let currentQ = null;
            let addedCount = 0;
            const lines = text.split('\n');

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;

                // Deteksi awalan nomor soal: "1.", "1)", "Q1."
                if (/^(Q?\d+[\.\)]\s*)/i.test(line)) {
                    if (currentQ) {
                        set.questions.push(currentQ);
                        addedCount++;
                    }
                    currentQ = {
                        id: set.questions.length + 1 + addedCount, // sementara, dire-index di akhir
                        section: sectionName,
                        text: line.replace(/^(Q?\d+[\.\)]\s*)/i, ''),
                        options: {A:'', B:'', C:'', D:''},
                        answer: 'A'
                    };
                } else if (currentQ) {
                    let upper = line.toUpperCase();
                    // Deteksi huruf Opsi (A., B., C., D. atau A), B), dsb)
                    if (upper.startsWith('A.') || upper.startsWith('A)')) currentQ.options.A = line.substring(2).trim();
                    else if (upper.startsWith('B.') || upper.startsWith('B)')) currentQ.options.B = line.substring(2).trim();
                    else if (upper.startsWith('C.') || upper.startsWith('C)')) currentQ.options.C = line.substring(2).trim();
                    else if (upper.startsWith('D.') || upper.startsWith('D)')) currentQ.options.D = line.substring(2).trim();
                    // Deteksi Kunci Jawaban
                    else if (upper.startsWith('ANSWER:') || upper.startsWith('ANSWER :') || upper.startsWith('JAWABAN:') || upper.startsWith('ANS:')) {
                        let match = upper.match(/[A-D]/);
                        if (match) currentQ.answer = match[0];
                    } else {
                        // Jika teks pertanyaan panjang (multibaris) dan opsi A belum terdeteksi, gabungkan ke teks
                        if (!currentQ.options.A) {
                            currentQ.text += ' ' + line;
                        }
                    }
                }
            }
            // Mendorong (push) pertanyaan terakhir di dalam loop
            if (currentQ) { set.questions.push(currentQ); addedCount++; }

            // Merapikan ulang seluruh nomor urut ID pada sistem
            set.questions.forEach((q, idx) => q.id = idx + 1);

            syncToCloud();
            closeModal();
            viewSetDetails(setId);
            alert(`✅ Berhasil mengekstrak dan menambahkan ${addedCount} soal baru.`);
        }

        function saveAssign() {
            const cbx = document.querySelectorAll('.ucb:checked');
            if(cbx.length === 0) return alert('Select at least 1 user.');
            const isType = !document.getElementById('col-t').classList.contains('hidden');
            const exTitle = isType ? document.getElementById('as-t').value : document.getElementById('as-m').value;
            const inst = document.getElementById('as-inst').value;
            const eDate = document.getElementById('as-date').value;
            
            if(!exTitle || !inst || !eDate) return alert('Complete all required fields.');

            // --- NEW CODE: Logika Pengecekan Urutan Cycle secara Otomatis ---
            const targetSet = state.questionSets.find(q => q.title === exTitle);
            if (targetSet && targetSet.cycle && targetSet.cycle !== 'None') {
                let errorMsg = '';
                
                for(let i=0; i<cbx.length; i++) {
                    const uid = Number(cbx[i].value);
                    const uname = cbx[i].dataset.name;
                    
                    // Tarik seluruh riwayat tugas user ini
                    const userHistory = state.assignments.filter(a => a.userId === uid);
                    let latestCycle = null;
                    let latestDate = 0;
                    
                    // Mencari siklus terakhir yang dikerjakan pada kategori pesawat/training yang IDENTIK
                    userHistory.forEach(a => {
                        const aSet = state.questionSets.find(q => q.title === a.examTitle);
                        if (aSet && aSet.category === targetSet.category && aSet.type === targetSet.type && aSet.rating === targetSet.rating && aSet.model === targetSet.model && aSet.mandatoryType === targetSet.mandatoryType && aSet.cycle && aSet.cycle !== 'None') {
                            const aDate = new Date(a.examDate).getTime();
                            if (aDate >= latestDate) {
                                latestDate = aDate;
                                latestCycle = aSet.cycle; // Menyimpan cycle terakhir
                            }
                        }
                    });
                    
                    // Tentukan aturan urutan siklus selanjutnya
                    let expectedCycle = 'Cycle 1';
                    if (latestCycle === 'Cycle 1') expectedCycle = 'Cycle 2';
                    else if (latestCycle === 'Cycle 2') expectedCycle = 'Cycle 3';
                    else if (latestCycle === 'Cycle 3') expectedCycle = 'Cycle 1';
                    
                    // Tolak jika Cycle yang di assign tidak sesuai urutan
                    if (targetSet.cycle !== expectedCycle) {
                        errorMsg += `- ${uname} (Seharusnya mengerjakan: ${expectedCycle})\n`;
                    }
                }
                
                if (errorMsg !== '') {
                    alert("⚠️ PENUGASAN DITOLAK\n\nSistem mendeteksi ada Trainee/Candidate yang tidak sesuai dengan urutan Cycle-nya:\n\n" + errorMsg + "\nSilakan periksa kembali siklus mereka.");
                    return; // Batalkan proses assign
                }
            }
            // --- END NEW CODE ---

            let durStr = '';
            const h = document.getElementById('as-dur-h').value, m = document.getElementById('as-dur-m').value;
            if (h) durStr += `${h}h `; if (m) durStr += `${m}m`;
            durStr = durStr.trim();

            const today = new Date().toISOString().split('T')[0];
            cbx.forEach(c => {
                state.assignments.push({ id: Date.now() + Math.random(), userId: Number(c.value), userName: c.dataset.name, examTitle: exTitle, instructor: inst, assignedDate: today, examDate: eDate, examTime: document.getElementById('as-time').value, duration: durStr, status: 'NOT STARTED', score: null, grade: null });
            });
            syncToCloud(); closeModal(); renderAssignment();
        }

                <button onclick="closeModal()" class="px-6 py-2.5 text-xs font-bold text-slate-400 hover:text-slate-600 uppercase tracking-wider">Close</button>
                <button onclick="printExamResult(${assignmentId})" class="px-8 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-black shadow-lg shadow-blue-100 uppercase tracking-widest flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Print PDF
                </button>
            `;
            modal.classList.remove('hidden');
        }

        function printExamResult(assignmentId) {
            const a = state.assignments.find(x => x.id === assignmentId);
            const u = state.users.find(x => x.id === a.userId);
            if(!a || !u) return;

            const titleLower = a.examTitle.toLowerCase();
            const isInitialOrUpgrade = titleLower.includes('initial') || titleLower.includes('upgrade');
            const isRecurrent = titleLower.includes('recurrent');
            const term = isInitialOrUpgrade ? 'Trainee' : 'Candidate';

            const instParts = a.instructor.split('(');
            const instName = instParts[0].trim();
            const instLOA = instParts[2] ? instParts[2].replace(')','').trim() : (instParts[1] ? instParts[1].replace(')','').trim() : '-');

            const instObj = state.instructors.find(x => x.name === instName);
            const instSignUrl = instObj ? instObj.signUrl : '';

            const set = state.questionSets.find(q => q.title === a.examTitle);
            const questions = set && set.questions.length > 0 ? set.questions : Array(10).fill({id: 0, text: 'Sample Question Text...', options: {A: 'Option A', B: 'Option B', C: 'Correct Option', D: 'Option D'}, answer: 'C'});
            
            const totalQs = questions.length;
            const correctCount = Math.round((a.score / 100) * totalQs);
            let answersHtml = '';
            
            for(let i=0; i<totalQs; i++) {
                const q = questions[i];
                const userAns = a.answers ? a.answers[q.id] : null;
                const isCorrect = userAns === q.answer;

                if(isCorrect) {
                    answersHtml += `
                        <div class="print-summary-item correct">
                            <b>Q${i+1}: ${q.text}</b><br>
                            ${q.answer}. ${q.options[q.answer]} ✓
                        </div>`;
                } else {
                    const wrongOptLabel = userAns ? `${userAns}. ${q.options[userAns] || ''}` : 'No Answer';
                    answersHtml += `
                        <div class="print-summary-item wrong">
                            <b>Q${i+1}: ${q.text}</b><br>
                            ${wrongOptLabel} ✗ (Correct: ${q.answer}. ${q.options[q.answer]})
                        </div>`;
                }
            }

            // PERBAIKAN: Mendeteksi data Cycle khusus jika ujian berjenis Recurrent
            const cycleDisplay = (isRecurrent && set && set.cycle && set.cycle !== 'None') ? set.cycle : null;

            const html = `
                <div class="print-page">
                    <div class="print-header">
                        <img src="https://lh3.googleusercontent.com/d/1WNcGjsZ9_Fp54xzOl01EYRqM6-wY5Zh7" alt="TWA Logo" style="display: block; margin: 0 auto 15px auto; height: 70px; object-fit: contain;" />
                        <h1>Transwisata Prima Aviation</h1>
                        <h2>FLIGHT CREW EXAMINATION RESULT</h2>
                        <h3>${a.examTitle}</h3>
                        ${cycleDisplay ? `<h4 style="margin: 5px 0 0 0; font-size: 12pt;">(${cycleDisplay.toUpperCase()})</h4>` : ''}
                        
                        <div style="display: flex; justify-content: space-between; align-items: flex-end; font-size: 10pt; margin-top: 15px;">
                            <div style="text-align: left; font-weight: bold; font-style: italic;">Online Examination Form</div>
                            <div style="text-align: right;">Form No: ${state.formNo ? state.formNo.value : '-'}</div>
                        </div>
                    </div>

                    <div class="print-section-title">${term.toUpperCase()} INFORMATION</div>
                    <table class="print-table">
                        <tr><td>Name ${term}:</td><td><b>${u.name}</b></td></tr>
                        <tr><td>Rank:</td><td><b>${u.rank}</b></td></tr>
                        <tr><td>No. License:</td><td><b>${u.license}</b></td></tr>
                        ${cycleDisplay ? `<tr><td>Training Cycle:</td><td><b>${cycleDisplay}</b></td></tr>` : ''}
                        <tr><td>Name Instructor:</td><td><b>${instName}</b></td></tr>
                        <tr><td>LOA Instructor:</td><td><b>${instLOA}</b></td></tr>
                        <tr><td>Exam Date:</td><td><b>${formatDisplayDate(a.examDate)}</b></td></tr>
                        <tr><td>Exam Time:</td><td><b>${a.examTime || '-'}</b></td></tr>
                        <tr><td>Duration:</td><td><b>${a.duration || '-'}</b></td></tr>
                    </table>

                    <div class="print-section-title" style="text-align: center;">EXAMINATION RESULT</div>
                    <div class="print-result-box">
                        <div class="print-score" style="color: ${a.score < 75 ? 'red' : 'green'};">${a.score}%</div>
                        <div style="font-weight: bold; margin-bottom: 5px;">${a.grade} - ${correctCount} out of ${totalQs} correct</div>
                        <div>Passing Score: 75% | Result: ${a.score >= 75 ? '✓ PASS' : '✗ FAIL'}</div>
                        ${isRecurrent ? `<div style="font-weight: bold; margin-top: 10px; color: green;">CORRECTED TO 100%</div>` : ''}
                    </div>

                    <div class="print-section-title">ANSWER SUMMARY</div>
                    <div>${answersHtml}</div>

                    <div class="print-signatures">
                        <div class="print-sig-box">
                            <div class="print-sig-title">${term} Signature</div>
                            <div class="print-sig-img">${u.signUrl || ''}</div>
                            <div class="print-sig-name">${u.name}</div>
                            <div class="print-sig-detail">${u.license || '-'}</div>
                        </div>
                        <div class="print-sig-box">
                            <div class="print-sig-title">Examiner Signature</div>
                            <div class="print-sig-img">${instSignUrl || ''}</div>
                            <div class="print-sig-name">${instName}</div>
                            <div class="print-sig-detail">${instLOA || '-'}</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('print-area').innerHTML = html;
            
            const images = Array.from(document.querySelectorAll('#print-area img'));
            if (images.length > 0) {
                const promises = images.map(img => {
                    return new Promise(resolve => {
                        if (img.complete) {
                            resolve();
                        } else {
                            img.onload = resolve;
                            img.onerror = resolve;
                        }
                    });
                });
                
                Promise.all(promises).then(() => {
                    window.print();
                    setTimeout(() => { document.getElementById('print-area').innerHTML = ''; }, 1000);
                });
            } else {
                window.print();
                setTimeout(() => { document.getElementById('print-area').innerHTML = ''; }, 1000);
            }
        }

        // --- USER PORTAL ---
        function renderUserPortal() {
            let html = `<div class="mb-8 page-fade"><h2 class="text-3xl font-black text-slate-800 tracking-tight">Welcome, ${state.currentUser.name}</h2><p class="text-slate-500 font-medium">Here are your assigned examination tasks.</p></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 page-fade" style="animation-delay: 0.1s">`;
            const myTasks = state.assignments.filter(a => a.userId === state.currentUser.id);
            if (myTasks.length === 0) {
                html += `<div class="col-span-full p-12 bg-white rounded-3xl shadow-sm border border-slate-100 text-center"><p class="text-slate-400 font-bold">No tasks assigned to you at the moment.</p></div>`;
            } else {
                myTasks.forEach(a => {
                    const isDone = a.status === 'COMPLETED';
                    const inProg = a.status === 'IN PROGRESS';
                    html += `
                        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col relative overflow-hidden group">
                            <div class="absolute top-0 right-0 p-4 opacity-10 transition-transform group-hover:scale-110"><svg class="w-20 h-20 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"></path></svg></div>
                            <div class="flex justify-between items-start mb-4 relative z-10"><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${isDone?'bg-green-100 text-green-700':inProg?'bg-blue-100 text-blue-700':'bg-amber-100 text-amber-700'}">${a.status}</span></div>
                            <h4 class="text-lg font-black text-slate-900 leading-tight mb-2 relative z-10">${a.examTitle}</h4>
                            <div class="space-y-1 text-xs text-slate-500 mb-6 flex-1 relative z-10">
                                <p class="flex items-center gap-2"><span class="w-4 text-center">📅</span> ${formatDisplayDate(a.examDate)}</p>
                                <p class="flex items-center gap-2"><span class="w-4 text-center">⏰</span> ${a.examTime || '-'} <span class="mx-1 opacity-50">|</span> ⏳ ${a.duration || '-'}</p>
                                <p class="flex items-center gap-2 font-bold text-slate-600 italic mt-2"><span class="w-4 text-center">👨‍✈️</span> ${a.instructor}</p>
                            </div>
                            <div class="relative z-10">
                                ${isDone ? `
                                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-center"><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Final Score</p><p class="text-2xl font-black ${a.score >= 75 ? 'text-green-500' : 'text-red-500'}">${a.score}%</p></div>
                                ` : `
                                    <button onclick="startRealExam(${a.id})" class="w-full py-4 ${inProg ? 'bg-amber-500 shadow-amber-200 hover:bg-amber-600' : 'bg-blue-600 shadow-blue-200 hover:bg-blue-700'} text-white rounded-xl text-xs font-black shadow-lg uppercase tracking-widest transition-colors">${inProg ? 'Resume Exam' : 'Start Exam'}</button>
                                `}
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('dynamic-content').innerHTML = html + `</div>`;
        }

        function startRealExam(assignmentId) {
            const a = state.assignments.find(x => x.id === assignmentId);
            const set = state.questionSets.find(q => q.title === a.examTitle);

            if (!set || !set.questions || set.questions.length === 0) return alert('Exam questions not found.');

            const now = new Date();
            const eDateParts = a.examDate.split('-');
            
            let durMins = 60;
            if (a.duration) {
                let h = 0, m = 0;
                const hm = a.duration.match(/(\d+)h/);
                const mm = a.duration.match(/(\d+)m/);
                if (hm) h = parseInt(hm[1]);
                if (mm) m = parseInt(mm[1]);
                if (h > 0 || m > 0) durMins = (h * 60) + m;
            }

            let initialTimeLeft = durMins * 60;

            if (eDateParts.length === 3) {
                const eDate = new Date(eDateParts[0], eDateParts[1] - 1, eDateParts[2]);
                eDate.setHours(0,0,0,0);
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

                if (today < eDate) {
                    return alert("The exam cannot be started because the assigned date has not been reached.");
                }

                if (today.getTime() === eDate.getTime() && a.examTime) {
                    const tParts = a.examTime.split(':');
                    if (tParts.length === 2) {
                        const currMins = now.getHours() * 60 + now.getMinutes();
                        const examMins = parseInt(tParts[0]) * 60 + parseInt(tParts[1]);
                        const endMins = examMins + durMins; 
                        
                        if (currMins < examMins) {
                            return alert("The exam cannot be started because the assigned time has not been reached.");
                        } else if (currMins >= endMins) {
                            return alert("Waktu ujian sudah habis.");
                        } else {
                            initialTimeLeft = (endMins - currMins) * 60;
                        }
                    }
                }
            }

            let shuffledQuestions = [...set.questions];
            for (let i = shuffledQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledQuestions[i], shuffledQuestions[j]] = [shuffledQuestions[j], shuffledQuestions[i]];
            }

            window.activeExam = {
                assignment: a,
                set: set,
                questions: shuffledQuestions,
                currentIndex: 0,
                answers: {},
                timeLeft: initialTimeLeft,
                timerId: null
            };

            a.status = 'IN PROGRESS';
            syncToCloud(); 
            
            window.activeExam.timerId = setInterval(() => {
                window.activeExam.timeLeft--;
                if (window.activeExam.timeLeft <= 0) {
                    clearInterval(window.activeExam.timerId);
                    window.activeExam.timeLeft = 0; 
                    alert("Waktu ujian sudah habis! Anda tidak dapat menjawab lagi. Silahkan tekan tombol submit.");
                    renderActiveExamUI(); 
                } else {
                    updateTimerUI();
                }
            }, 1000);

            renderActiveExamUI();
        }

        function updateTimerUI() {
            const el = document.getElementById('exam-timer-display');
            if (el && window.activeExam) {
                const m = Math.floor(window.activeExam.timeLeft / 60).toString().padStart(2, '0');
                const s = (window.activeExam.timeLeft % 60).toString().padStart(2, '0');
                el.innerText = `${m}:${s}`;
            }
        }

        function renderActiveExamUI() {
            const ex = window.activeExam;
            const q = ex.questions[ex.currentIndex];
            const isLast = ex.currentIndex === ex.questions.length - 1;
            const isFirst = ex.currentIndex === 0;
            const timeUp = ex.timeLeft <= 0; 

            let html = `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden page-fade">
                    <div class="bg-blue-600 p-6 text-white flex justify-between items-center">
                        <div>
                            <h3 class="font-black text-lg tracking-wider uppercase">${ex.set.title}</h3>
                            <p class="text-xs text-blue-200 mt-1 uppercase tracking-widest">Question ${ex.currentIndex + 1} of ${ex.questions.length}</p>
                        </div>
                        <div class="bg-blue-800/50 px-4 py-2 rounded-xl border border-blue-500 text-center">
                            <span class="text-[10px] uppercase font-bold text-blue-200 block mb-1">Time Remaining</span>
                            <span id="exam-timer-display" class="font-mono font-bold text-2xl ${timeUp ? 'text-red-400' : ''}">--:--</span>
                        </div>
                    </div>
                    
                    <div class="p-8 md:p-12">
                        <span class="text-[10px] font-black bg-blue-50 text-blue-600 px-3 py-1 rounded uppercase tracking-widest">${q.section}</span>
                        <h4 class="text-xl font-bold text-slate-800 mt-6 mb-8 leading-relaxed">${ex.currentIndex + 1}. ${q.text}</h4>
                        
                        <div class="space-y-4">
                            ${['A', 'B', 'C', 'D'].map(opt => {
                                const optText = q.options[opt];
                                if (!optText) return '';
                                const isSelected = ex.answers[q.id] === opt;
                                const cursorStyle = timeUp ? 'cursor-not-allowed opacity-70' : 'cursor-pointer hover:border-blue-300';
                                return `
                                    <div ${timeUp ? '' : `onclick="selectExamOption('${opt}')"`} class="p-5 border-2 rounded-2xl transition-all ${isSelected ? 'border-blue-600 bg-blue-50 shadow-md' : `border-slate-100 bg-white ${cursorStyle}`}">
                                        <div class="flex items-center gap-4">
                                            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm ${isSelected ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'}">${opt}</div>
                                            <span class="font-medium text-slate-700 text-base">${optText}</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="bg-slate-50 p-6 border-t border-slate-100 flex justify-between items-center">
                        <button onclick="navigateExam(-1)" class="px-8 py-3 text-sm font-bold text-slate-500 hover:text-slate-800 uppercase tracking-widest transition-colors ${isFirst ? 'invisible' : ''}">Previous</button>
                        ${(isLast || timeUp) ? `
                            <button onclick="submitExam(${timeUp ? 'true' : 'false'})" class="px-10 py-3 ${timeUp ? 'bg-red-600 shadow-red-100 hover:bg-red-700 animate-pulse' : 'bg-green-600 shadow-green-100 hover:bg-green-700'} text-white rounded-xl text-sm font-black shadow-lg uppercase tracking-widest transition-colors">Submit Your Answer</button>
                        ` : `
                            <button onclick="navigateExam(1)" class="px-10 py-3 bg-blue-600 text-white rounded-xl text-sm font-black shadow-lg shadow-blue-100 uppercase tracking-widest hover:bg-blue-700 transition-colors">Next</button>
                        `}
                    </div>
                </div>
            `;

            document.getElementById('dynamic-content').innerHTML = html;
            updateTimerUI(); 
        }

        function selectExamOption(opt) {
            if (window.activeExam.timeLeft <= 0) return; 
            window.activeExam.answers[window.activeExam.questions[window.activeExam.currentIndex].id] = opt;
            renderActiveExamUI(); 
            
            if (window.activeExam.currentIndex < window.activeExam.questions.length - 1) {
                setTimeout(() => navigateExam(1), 300);
            }
        }

        function navigateExam(dir) {
            window.activeExam.currentIndex += dir;
            renderActiveExamUI();
        }

        function submitExam(force = false) {
            if (force !== true && !confirm("Are you sure you want to submit your exam?")) return;
            
            const ex = window.activeExam;
            clearInterval(ex.timerId);

            let correctCount = 0;
            ex.questions.forEach(q => {
                if (ex.answers[q.id] === q.answer) correctCount++;
            });

            const score = Math.round((correctCount / ex.questions.length) * 100);
            let grade = 'FAILED';
            if (score === 100) grade = 'PERFECT';
            else if (score >= 86) grade = 'EXCELLENT';
            else if (score >= 75) grade = 'PASSED';

            ex.assignment.status = 'COMPLETED';
            ex.assignment.score = score;
            ex.assignment.grade = grade;
            ex.assignment.answers = ex.answers;

            syncToCloud(); 
            renderExamResultUserView(ex, score, grade, correctCount);
        }

        function renderExamResultUserView(ex, score, grade, correctCount) {
            const isRecurrent = ex.assignment.examTitle.toLowerCase().includes('recurrent');
            let sCl = "text-red-500";
            if (score === 100) sCl = "text-gold";
            else if (score >= 75) sCl = "text-green-500";

            let answersHtml = '';
            ex.questions.forEach((q, index) => {
                const userAns = ex.answers[q.id];
                const isCorrect = userAns === q.answer;
                if(isCorrect) {
                    answersHtml += `
                        <div class="mb-3 p-5 bg-green-50 border border-green-100 rounded-xl">
                            <p class="font-bold text-sm text-slate-800 mb-2">Q${index + 1}: ${q.text}</p>
                            <p class="text-xs font-bold text-green-600">${q.answer}. ${q.options[q.answer]} ✓</p>
                        </div>`;
                } else {
                    answersHtml += `
                        <div class="mb-3 p-5 bg-red-50 border border-red-100 rounded-xl">
                            <p class="font-bold text-sm text-slate-800 mb-2">Q${index + 1}: ${q.text}</p>
                            <p class="text-xs font-bold text-red-500 mb-2">${userAns ? userAns + '. ' + q.options[userAns] : 'No Answer'} ✗</p>
                            <p class="text-[10px] font-bold text-green-600">Correct: ${q.answer}. ${q.options[q.answer]}</p>
                        </div>`;
                }
            });

            let html = `
                <div class="max-w-3xl mx-auto space-y-6 page-fade">
                    <div class="bg-dark-card p-8 rounded-3xl shadow-2xl text-center border border-slate-700 relative overflow-hidden">
                        <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-400 via-transparent to-transparent"></div>
                        <h2 class="text-white text-sm font-black uppercase tracking-widest mb-4 relative z-10">EXAMINATION COMPLETED</h2>
                        <div class="text-7xl font-black ${sCl} mb-4 relative z-10 drop-shadow-lg">${score}%</div>
                        <div class="inline-block px-4 py-1 rounded-full ${score >= 75 ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'} font-bold text-sm uppercase tracking-widest relative z-10 mb-2">${grade}</div>
                        <p class="text-slate-400 text-xs font-medium relative z-10">${correctCount} correct out of ${ex.questions.length} questions</p>
                        ${isRecurrent ? `<p class="mt-4 text-green-400 font-bold text-xs uppercase tracking-widest relative z-10 border border-green-500/30 inline-block px-3 py-1 rounded bg-green-500/10">CORRECTED TO 100%</p>` : ''}
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8">
                        <h3 class="text-lg font-black text-slate-800 uppercase tracking-widest mb-6 border-b border-slate-100 pb-4">Detailed Review</h3>
                        <div class="space-y-2">
                            ${answersHtml}
                        </div>
                    </div>
                    
                    <div class="text-center pt-4">
                        <button onclick="renderUserPortal()" class="px-10 py-4 bg-slate-900 text-white rounded-xl text-sm font-black shadow-xl hover:bg-slate-800 uppercase tracking-widest transition-all">Back to Dashboard</button>
                    </div>
                </div>
            `;
            document.getElementById('dynamic-content').innerHTML = html;
        }

        // --- UTILS ---
        function closeModal() { document.getElementById('modal-container').classList.add('hidden'); }
    </script>
</body>
</html>
